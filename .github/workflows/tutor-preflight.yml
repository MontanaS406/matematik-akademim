name: Tutor deployment compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tutor-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the deployed Worker supports account sessions
        run: node scripts/verify-tutor-deployment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tutor-deployment-preflight
          path: work/tutor-live-preflight.json
