name: Official booklet integration
on:
  pull_request:
    paths:
      - '.github/workflows/official-booklets.yml'
      - 'scripts/official-booklet-smoke.mjs'
      - 'js/**'
      - 'shared/**'
      - 'data/turkish-exams.js'
      - 'styles/**'
      - 'index.html'
permissions:
  contents: read
jobs:
  official-booklets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Public publisher documents are held only in runner/browser memory.
      # No document bytes, screenshots, traces, or test artifacts are uploaded.
      - name: Render and solve the actual official 2024 TYT and AYT booklets
        run: node scripts/official-booklet-smoke.mjs
        env:
          RUN_OFFICIAL_BOOKLET_SMOKE: '1'
