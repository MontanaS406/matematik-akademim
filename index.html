<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1424">
  <title>Matematik Akademim</title>
  <link rel="stylesheet" href="styles/platform.css?v=issue11-20261113">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#" aria-label="Matematik Akademim ana ekran"><span class="brand-mark" aria-hidden="true">∑</span><span>Matematik<br><strong>Akademim</strong></span></a>
    <button id="accountButton" class="account-button" aria-label="Hesabım"><span class="account-dot" aria-hidden="true">●</span><span>Hesabım</span></button>
  </header>
  <nav class="nav" aria-label="Ana menü">
    <button class="active" data-page="study"><span class="nav-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 8h8M8 12h6M8 16h4"/></svg></span><span>Soru çöz</span></button>
    <button data-page="library"><span class="nav-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span><span>Konular</span></button>
    <button data-page="teacher"><span class="nav-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="M7 10.5V16c3 3 7 3 10 0v-5.5M21 8v8"/></svg></span><span>Öğretmen</span></button>
  </nav>
  <main class="wrap">
    <section id="study" class="app-page"><div id="learningRoot"></div></section>
    <section id="library" class="app-page hide">
      <div class="page-heading"><div><p class="eyebrow">ADIM ADIM ÖĞREN</p><h1>Konular</h1></div><span id="lessonCount" class="count-badge"></span></div>
      <label class="search-box" for="lessonSearch"><span aria-hidden="true">⌕</span><input id="lessonSearch" type="search" placeholder="Konu ara" autocomplete="off"></label>
      <div id="lessonGroups" class="filter-pills" aria-label="Konu grupları"></div>
      <div id="lessonList" class="lesson-grid"></div>
      <article id="lessonDetails" class="surface lesson-content hide"></article>
    </section>
    <section id="teacher" class="app-page hide">
      <div class="page-heading"><div><p class="eyebrow">BİRLİKTE ÇÖZELİM</p><h1>Öğretmenin</h1></div><button id="teacherChange" class="smallbtn">Değiştir</button></div>
      <div class="surface tutor-panel">
        <div class="tutor-identity"><span id="selectedTeacherAvatar" class="avatar"></span><div><h2 id="selectedTeacherName"></h2><p id="teacherDescription"></p></div></div>
        <p id="aiQuestion" class="context-note"></p>
        <div id="teacherOptions"></div>
        <div id="chat" class="chat" role="log" aria-live="polite"></div>
        <div class="chat-tools"><select id="tutorMode" aria-label="Yardım biçimi"><option value="hint">İpucu</option><option value="solution">Adım adım</option></select><button id="clearChat" class="text-button">Sohbeti temizle</button></div>
        <label class="sr-only" for="message">Öğretmene mesajın</label><div class="message-box"><textarea id="message" maxlength="2500" rows="2" placeholder="Takıldığın adımı yaz…"></textarea><button id="send" class="btn" aria-label="Mesaj gönder">Gönder <span aria-hidden="true">→</span></button></div>
        <p id="aiStatus" class="status-note" role="status"></p>
      </div>
      <details class="connection-settings"><summary>Bağlantı ayarları</summary><label for="endpoint">Öğretmen sunucusu</label><input class="field" id="endpoint" type="url" placeholder="https://…workers.dev"><label for="access">Erişim kodu</label><input class="field" id="access" type="password" autocomplete="off"><button class="smallbtn" id="saveAI">Kaydet</button></details>
    </section>
  </main>
  <dialog id="teacherDialog" class="app-dialog"><div class="dialog-heading"><h2>Öğretmenini seç</h2><button id="closeTeacherDialog" class="icon-button" aria-label="Kapat">×</button></div><div id="teacherPicker" class="teacher-grid"></div></dialog>
  <dialog id="sourceInfo" class="app-dialog"><div class="dialog-heading"><h2>Soru bilgisi</h2><button id="closeSourceInfo" class="icon-button" aria-label="Kapat">×</button></div><p id="sourceAttribution" class="legal-note"></p><div class="source-links"><a id="originalSourceLink" target="_blank" rel="noopener noreferrer">Kaynak</a><a id="licenseLink" target="_blank" rel="noopener noreferrer">Lisans</a><a id="answerEvidenceLink" target="_blank" rel="noopener noreferrer">Cevap</a></div></dialog>
  <script type="module" src="js/app.js?v=issue11-20261113"></script>
  <script type="module" src="js/exams.js?v=issue11-20261113"></script>
</body>
</html>
